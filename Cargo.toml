[package]
name = "agent-graph-tui"
version = "0.1.0"
edition = "2021"
description = "Lightweight terminal viewer for Claude Code / Codex agent execution graphs"
license = "Apache-2.0"
repository = "https://github.com/sh-ai-x/agent-graph-tui"

[dependencies]
ratatui        = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm      = { version = "0.28", default-features = false, features = ["events", "use-dev-tty"] }
serde          = { version = "1",     default-features = false, features = ["derive", "std"] }
serde_json     = { version = "1",     default-features = false, features = ["std"] }

[profile.release]
opt-level      = 3
lto            = "fat"
codegen-units  = 1
strip          = "symbols"
panic          = "abort"
incremental    = false

[[bin]]
name = "agent-graph-tui"
path = "src/main.rs"
